<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stardust Music - Register</title>
    <link rel="stylesheet" href="style_login.css">
</head>
<body>

<header>
    <nav>
        <img src="logo.png" alt="Stardust Music Logo" width="50">
        <h1>STARDUST MUSIC</h1>
    </nav>
</header>

<main>
    <section id="login-container">
        <h2>Register Your Account</h2>

        <p>Already have an account? <a href="login.html">Log In</a></p>

        <form id="register-form" method="POST">

            <!-- Username -->
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit">REGISTER</button>

        </form>

        <p id="error-message" style="color: red;"></p>

    </section>
</main>

<script>
    const API_BASE = "";

    document.getElementById("register-form").addEventListener("submit", async function(e) {

        e.preventDefault();

        const user_name = document.getElementById("username").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        const errorBox = document.getElementById("error-message");

        // basic frontend validation (important for demo)
        if (!user_name || !email || !password) {
            errorBox.innerText = "All fields are required";
            return;
        }

        try {
            const response = await fetch(`${API_BASE}/register`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    user_name,
                    email,
                    password
                })
            });

            const data = await response.json();

            if (data.success) {
                window.location.href = "login.html";
            } else {
                errorBox.innerText = data.message || "Registration failed";
            }

        } catch (error) {
            console.log(error);
            errorBox.innerText = "Server error. Please try again.";
        }
    });
</script>

</body>
</html>
