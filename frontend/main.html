<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page title for browser tab -->
    <title>Stardust Music - Dashboard</title>

    <!-- External CSS for homepage/dashboard styling -->
    <link rel="stylesheet" href="/public/style_home.css">
</head>

<body>

<!-- HEADER SECTION - logo + logout -->
<header class="main-header">

    <div class="header-left">
        <img src="/public/logo.png" alt="Stardust Music Logo" width="50">
        <h1>STARDUST MUSIC</h1>
    </div>

    <!-- the logout button triggers session clear and redirects to login page -->
    <a href="login.html">
        <button id="logout-btn" class="logout-btn" onclick="logout()">Logout</button>
    </a>

</header>

<!-- MAIN DASHBOARD CONTENT -->
<main class="content-container">

    <!-- welcome back message !! (dynamic username from localStorage) -->
    <section class="user-banner">
        <h1 id="welcome-msg">Welcome Back <span id="user_name">User</span>!</h1>
    </section>

    <!-- SUBSCRIPTION TABLE SECTION -->
    <section class="subscription-section">

        <div class="sub-header">

            <div class="sub-title-box">Your Subscriptions!</div>

            <!-- the button opens modal for song search -->
            <button class="add-songs-box" onclick="toggleModal(true)">
                <span>Add New Songs?</span>
                <span class="plus-btn">+</span>
            </button>

        </div>

        <!-- table shows the subscribed songs -->
        <table class="music-table">
            <thead>
            <tr>
                <th>#</th>
                <th>Image</th>
                <th>Title</th>
                <th>Artists</th>
                <th>Album</th>
                <th>Year</th>
                <th>Remove</th>
            </tr>
            </thead>

            <!-- dynamically populated subscription rows -->
            <tbody id="subscription-body"></tbody>
        </table>

    </section>
</main>

<!-- SEARCH MODAL POPUP -->
<div id="query-modal" class="modal-overlay">

    <div class="modal-content">

        <!-- close button for modal -->
        <div class="modal-top-bar">
            <span class="close-x" onclick="toggleModal(false)">&times;</span>
        </div>

        <!-- Search input fields -->
        <div class="query-inputs">

            <div class="input-group">
                <label>Title</label>
                <input type="text" id="q-title" placeholder="Text box">
            </div>

            <div class="input-group">
                <label>Artist</label>
                <input type="text" id="q-artist" placeholder="Text box">
            </div>

            <div class="input-group">
                <label>Year</label>
                <input type="text" id="q-year" placeholder="Text box">
            </div>

            <div class="input-group">
                <label>Album</label>
                <input type="text" id="q-album" placeholder="Text box">
            </div>

            <!-- triggers the search API call -->
            <button class="search-btn-modal" onclick="performSearch()">Search!</button>

        </div>

        <!-- Search results table -->
        <div class="results-area">

            <div class="results-label">Your Matching Results !! :</div>

            <table class="music-table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Image</th>
                    <th>Title</th>
                    <th>Artists</th>
                    <th>Album</th>
                    <th>Year</th>
                    <th>Subscribe</th>
                </tr>
                </thead>

                <!-- dashboard populated search results -->
                <tbody id="query-results-body"></tbody>
            </table>

        </div>

        <!-- Error popup, when NO results found -->
        <div id="no-results-popup" class="error-modal" style="display:none;">
            <span class="close-x-small" onclick="closeError()">&times;</span>
            <p>No result is retrieved. Please try again</p>
        </div>

    </div>
</div>

<!-- FRONTEND JAVASCRIPT LOGIC -->
<script>

    /* API CONFIGURATION - Supports EC2/ECS/Lambda switching */
    const API_BASE = "";

    /* SAFE RESPONSE PARSER - Handles EC2 vs Lambda formats */
    function parseResponse(raw) {
        if (raw.body) {
            try {
                return typeof raw.body === "string"
                    ? JSON.parse(raw.body)
                    : raw.body;
            } catch (e) {
                return raw.body;
            }
        }
        return raw;
    }

    /* MODAL CONTROLS */
    function toggleModal(show) {
        document.getElementById('query-modal').style.display = show ? 'flex' : 'none';
    }

    function closeError() {
        document.getElementById('no-results-popup').style.display = 'none';
    }

    /* PAGE INITIALISATION - Loads user session + subscriptions */
    window.onload = async () => {

        try {
            const username = localStorage.getItem("user_name");

            // displays the logged-in user name
            document.getElementById("user_name").innerText = username || "User";

            // loads the user's subscriptions on page load
            await loadSubscriptions();

        } catch (err) {
            console.log(err);

            // redirects if session is invalid
            window.location.href = "/login.html";
        }
    };

    /* MUSIC SEARCH FUNCTION */
    async function performSearch() {

        // collects the search filters
        const title = document.getElementById("q-title").value;
        const artist = document.getElementById("q-artist").value;
        const year = document.getElementById("q-year").value;
        const album = document.getElementById("q-album").value;

        const queryObj = {};
        if (title) queryObj.title = title;
        if (artist) queryObj.artist = artist;
        if (year) queryObj.year = year;
        if (album) queryObj.album = album;

        const query = new URLSearchParams(queryObj);

        try {
            const res = await fetch(`${API_BASE}/music/search?${query}`);
            const raw = await res.json();

            let data = raw;

            // normalises the Lambda response format
            if (raw.body) {
                data = typeof raw.body === "string"
                    ? JSON.parse(raw.body)
                    : raw.body;
            }

            const items = data.items || data.success?.items || data || [];

            const tbody = document.getElementById("query-results-body");
            tbody.innerHTML = "";

            // shows the error popup when no results
            if (items.length === 0) {
                document.getElementById("no-results-popup").style.display = "block";
                return;
            }

            // renders the search results dynamically
            items.forEach((song, index) => {

                const row = `
                    <tr>
                        <td>${index + 1}</td>
                        <td><img src="${song.img_url}" width="50"></td>
                        <td>${song.title}</td>
                        <td>${song.artist}</td>
                        <td>${song.album}</td>
                        <td>${song.year}</td>
                        <td>
                            <button data-song='${JSON.stringify(song)}'
                                onclick="subscribeSong(JSON.parse(this.dataset.song))">
                                Subscribe
                            </button>
                        </td>
                    </tr>
                `;

                tbody.innerHTML += row;
            });

        } catch (err) {
            console.log(err);
            alert("Search failed");
        }
    }

    /* SUBSCRIBE TO SONG */
    async function subscribeSong(song) {

        const email = localStorage.getItem("email");

        if (!email) {
            alert("No user logged in");
            return;
        }

        try {
            await fetch(`${API_BASE}/subscribe`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    email,
                    song_id: song.album + "#" + song.title,
                    title: song.title,
                    artist: song.artist,
                    album: song.album,
                    year: song.year,
                    img_url: song.img_url
                })
            });

            alert("Subscribed!");
            loadSubscriptions();

        } catch (err) {
            console.log(err);
        }
    }

    /* LOAD USER SUBSCRIPTIONS */
    async function loadSubscriptions() {

        const email = localStorage.getItem("email");
        if (!email) return;

        try {
            const res = await fetch(`${API_BASE}/subscriptions?email=${email}`);
            const raw = await res.json();
            const data = parseResponse(raw);

            const items = Array.isArray(data)
                ? data
                : data.items || data.Items || [];

            const tbody = document.getElementById("subscription-body");
            tbody.innerHTML = "";

            items.forEach((song, index) => {

                const row = `
                    <tr>
                        <td>${index + 1}</td>
                        <td><img src="${song.img_url}" width="50"></td>
                        <td>${song.title}</td>
                        <td>${song.artist}</td>
                        <td>${song.album}</td>
                        <td>${song.year}</td>
                        <td>
                            <button onclick="removeSong('${song.email}', '${song.song_id}')">
                                Remove
                            </button>
                        </td>
                    </tr>
                `;

                tbody.innerHTML += row;
            });

        } catch (err) {
            console.log(err);
        }
    }

    /* REMOVE SUBSCRIPTION */
    async function removeSong(email, song_id) {

        try {
            await fetch(`${API_BASE}/subscription`, {
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, song_id })
            });

            loadSubscriptions();

        } catch (err) {
            console.log(err);
        }
    }

    /* LOGOUT FUNCTION */
    async function logout() {
        await fetch("/logout", { method: "POST" });

        localStorage.removeItem("email");
        localStorage.removeItem("user_name");

        window.location.href = "/login.html";
    }

</script>

</body>
</html>
